name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/stk/playerapp
          mv MainActivity.kt StalkerClient.kt app/src/main/java/com/stk/playerapp/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StalkerPlayer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
